name: Build VisualRatio

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: visualratio-1.19.2
          path: build/libs/*.jar
      - run: gradle genSources --stacktrace || true
      - run: find / -iname "*sources*.jar" 2>/dev/null | grep -i minecraft > /tmp/srcjar.txt; cat /tmp/srcjar.txt
      - run: |
          SRC_JAR=$(cat /tmp/srcjar.txt | head -n 1)
          mkdir -p /tmp/extracted
          unzip -o "$SRC_JAR" "net/minecraft/client/render/GameRenderer.java" -d /tmp/extracted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decompiled-source
          path: /tmp/extracted
